# =============================================================================
#  Monli Kiosk - Server Block Nginx - Orange Pi (monli-barr)
#  Fase 2: dashboard kiosco servido en el puerto 8080.
#  Webroot: /var/www/monli-kiosk  (propiedad www-data:www-data)
# =============================================================================
server {
    listen 8080;
    listen [::]:8080;

    server_name monli-kiosk 100.88.140.37 monli-barr.tailb50aad.ts.net;

    root /var/www/monli-kiosk;
    index index.html;

    access_log /var/log/nginx/monli-kiosk.access.log;
    error_log  /var/log/nginx/monli-kiosk.error.log;

    # SPA ligera: sirve el fichero o devuelve 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # status.json se sirve directamente desde el HTML de Dolibarr (lo escribe
    # el cron de observabilidad). Se expone en el mismo origen del kiosco.
    location = /status.json {
        alias /var/www/monli-barr/htdocs/status.json;
        add_header Cache-Control "no-store";
    }

    # Estáticos sin cache agresiva (el kiosco se actualiza con frecuencia).
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=300";
    }

    # Sin PHP: el kiosco es 100% estático. Evita cualquier ejecución.
    location ~ \.php$ {
        return 404;
    }
}
